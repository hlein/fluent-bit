# Extra set of common parsers
#

parsers:
  - name: crowbar
    # https://rubular.com/r/cCVd1HLCAO
    format: regex
    regex: '^.*\[(?<log_time>[^ ][-.\d\+:]+T[:\d]*)([^\]])*?\]\s+?(?<severity>[^ ]\w+)([\s-]*):?\s+(?<message>.*)'
    time_format: '%Y-%m-%dT%H:%M:%S'
    time_keep: Off
    time_key: log_time

  - name: chefclient
    # https://rubular.com/r/frDgnElXW9
    format: regex
    regex: '^\[(?<log_time>[^ ][-.\d\+:]+T[:\d]*)([^\]])*?\]\s+(?<severity>[^ ]\w+):\s+(?<message>.*)$'
    time_format: '%Y-%m-%dT%H:%M:%S'
    time_keep: Off
    time_key: log_time

  - name: mysql_error
    format: regex
    #regex: '^(?<log_time>[^ +][ -:0-9TZ]+|[[:upper:]][[:lower:]]{2})(\+\d+:\d+[TZ]*){0,1}\s*(?<myid>[^ ]\d+)\s+\[(?<severity>[^ ]\w+)\](\s+(?<subsystem>[^ ]\w+):){0,1}\s+(?<message>.*)$'
    regex: '^(?<log_time>[^ +][-\d]+[\ T]*[:\dZ]+)\s*(?<myid>[^ ]\d+)\s+\[(?<severity>[^ ]\w+)\](\s+(?<subsystem>[^ ]\w+):){0,1}\s+(?<message>.*)$'
    time_format: '%Y-%m-%d %H:%M:%S'
    time_keep: Off
    time_key: log_time

  - name: mysql_slow
    format: regex
    regex: '^# User\@Host:\s+(?<user>[^\@][\w\[\]]+)[@\s]+(?<dbhost>[^ ][-.\w]+)\s+(\[(?<dbhost_address>[.\d]+)\]){0,1}\s+(?<message>.*)$'

  - name: pacemaker
    format: regex
    regex: '^\s*(?<log_time>[^ ]* {1,2}[^ ]* [^ ]*) \[(?<pid>\d+)\] (?<node>[\-\w]*)\s*(?<component>\w*):\s+(?<severity>\w+):\s+(?<message>.*)$'
    #time_format: '%Y-%m-%dT%H:%M:%S'
    time_format: '%b %d %H:%M:%S'
    time_keep: Off
    time_key: log_time
    #types: 'pid:integer'
    #

  - name: rabbitmq
    format: regex
    regex: '^=(?<severity>[^ ]\w+)\s+REPORT[=\s]*(?<log_time>[^ =][-:.\d\w]+)[\s=]+(?<message>.*)$'
    time_format: '%d-%b-%Y::%H:%M:%S'
    time_keep: Off
    time_key: log_time

  - name: http_statement
    format: regex
    regex: '^.*((?<req_method>GET|POST|PUT|DELETE|CONNECT|OPTIONS|HEAD[^ ]\w+)\s*(?<req_path>[^ ][-._?=%&\/[:alnum:]]*)\s*(?<req_protocol>[^ ][.\/\dHTFSP]+){0,1})([''"\s]*){0,1}((\s*status:\s*(?<req_status>[^ ]\d+)){0,1}(\s*len:\ (?<req_len>[^ ]\d+)){0,1}(\s*time:\s*(?<req_log_time>[^ ][.\d]+)){0,1}(\s*microversion:\s*(?<req_mver>[^ ][.\d]+)){0,1}){0,1}$'

  - name: universal
    format: regex
    regex: '^(?<message>.*)$'

  - name: uuid
    format: regex
    regex: '(?<uuid>[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12})'
    #UUID v1 :
    #/^[0-9A-F]{8}-[0-9A-F]{4}-[1][0-9A-F]{3}-[89AB][0-9A-F]{3}-[0-9A-F]{12}$/i
    #UUID v2 :
    #/^[0-9A-F]{8}-[0-9A-F]{4}-[2][0-9A-F]{3}-[89AB][0-9A-F]{3}-[0-9A-F]{12}$/i
    #UUID v3 :
    #/^[0-9A-F]{8}-[0-9A-F]{4}-[3][0-9A-F]{3}-[89AB][0-9A-F]{3}-[0-9A-F]{12}$/i
    #UUID v4 :
    #/^[0-9A-F]{8}-[0-9A-F]{4}-[4][0-9A-F]{3}-[89AB][0-9A-F]{3}-[0-9A-F]{12}$/i
    #UUID v5 :
    #/^[0-9A-F]{8}-[0-9A-F]{4}-[5][0-9A-F]{3}-[89AB][0-9A-F]{3}-[0-9A-F]{12}$/i

  - name: iptables
    # Parse IP Tables rules
    # N.B. ipv4 only
    # https://regex101.com/r/DujdAl/1
    format: regex
    regex: |
      (?x)

       # kernel timestamp - optional, and may have already been consumed
       (?: \[\s* (?<kernel_uptime>[0-9]+\.[0-9]+) \]\s )?

       # Log prefix - depends on the rule-building tools
       (?:

        # Original Fluent-Bit PR #3108
        \[
        (?<rule_chain>\w*) -
        (?<rule_name>\w*) -
        (?<accept_or_drop>\w*)
        \]
       |

        # UFW
        \[ UFW\s (?<accept_or_drop> (?: ALLOW | AUDIT | BLOCK ) ) \] \s
       |

        # firewalld
        (?<rule_chain>[^_]+)_
        (?<fw_direction> (?: FWD | IN | OUT ) )_
        (?: (?<fw_zone>[a-z0-9]+) _ )?
        (?<accept_or_drop>[A-Z]+) : \s
       |

        # Calico
        calico-
        (?<accept_or_drop>\w*)
        : \s
       |

        # other
        FW:\s (?<fw_direction>[a-z]+) \s
        (?<accept_or_drop>[A-Z]+) \s
       |

        # Conntrack error
        nf_ct_proto_6:\s
        (?:
         (?<nf_ct_err>bad\s checksum)
        |
         (?<nf_ct_err>challenge-ack\s ignored)
        |
         (?<nf_ct_err>invalid \s
           (?: new | rst | tcp\s flag\s combination | truncated\s packet )
         )
        |
         packet\s \( index\s [0-3] \) \s
         in\s dir\s [01]\s
         (?<nf_ct_err>ignored) ,\s
         state\s (?<tcp_state>[A-Z0-9_]+)
        ) \s
       |

        # support arbitrary unknown prefixes rather than fail to match
        (?<fw_unknown_prefix>.{1,64}?)
       )

       IN=(?<in_interface>[\w.]+)?\s
       OUT=(?<out_interface>[\w.]+)?\s

       # MAC can be missing or empty
       (?:
        MAC=
        (?:
         (?<macdst>[0-9a-f]{2}:[0-9a-f]{2}:[0-9a-f]{2}:[0-9a-f]{2}:[0-9a-f]{2}:[0-9a-f]{2})
         :
         (?<macsrc>[0-9a-f]{2}:[0-9a-f]{2}:[0-9a-f]{2}:[0-9a-f]{2}:[0-9a-f]{2}:[0-9a-f]{2})
         :
         # Ether type can be longer when processing incoming VLAN-tagged packets
         (?<ethtype>[0-9a-f]{2} (?::[0-9a-f]{2})+ )
        )?
        \s
       )?

       SRC=(?<source>(?:[0-9]{1,3}\.){3}[0-9]{1,3})\s
       DST=(?<dest>(?:[0-9]{1,3}\.){3}[0-9]{1,3})\s
       LEN=(?<pkt_len>\d+)\s
       # kernel nf_log_syslog.c mixes 0x%x and 0x%X for various hex outputs,
       # be defensive in case someone decides to standardize some day
       TOS=(?<pkt_tos>0x[A-Fa-f0-9]+)\s
       PREC=(?<pkt_prec>0x[A-Fa-f0-9]+)\s
       TTL=(?<pkt_ttl>\d+)\s
       ID=(?<pkt_id>\d+)\s
       (?: (?<ip_df>DF) \s )?

       # Get what we can out of each protocol
       PROTO=
       (?:
        (?<proto>TCP) \s
        SPT=(?<src_port>\d+) \s
        DPT=(?<dst_port>\d+) \s
        # Some logs are missing SEQ= and ACK=
        (?:
         SEQ=\d+ \s
         ACK=\d+ \s
        )?
        WINDOW=(?<tcp_win>[0-9]+) \s
        RES=0x[A-Fa-f0-9]{2} \s
        (?: (?<tcp_flag_cwr>CWR) \s )?
        (?: (?<tcp_ewe>EWE) \s )?
        (?: (?<tcp_urg>URG) \s )?
        (?: (?<tcp_ack>ACK) \s )?
        (?: (?<tcp_psh>PSH) \s )?
        (?: (?<tcp_rst>RST) \s )?
        (?: (?<tcp_syn>SYN) \s )?
        (?: (?<tcp_fin>FIN) \s )?
        URGP=\d+ \s
        (?: OPT \s \( [^)\s]+ \) \s )?
       |
        (?<proto>UDP) \s
        SPT=(?<src_port>\d+) \s
        DPT=(?<dst_port>\d+) \s
        LEN=(?<udp_len>\d+) \s
       |
        (?<proto>ICMP) \s
        TYPE=(?<icmp_type>\d+) \s
        CODE=(?<icmp_code>\d) \s
        # Some ICMP errors have an embedded packet header inside
        (?:
         ID=(?<icmp_id>\d+) \s
         SEQ=(?<icmp_seq>\d+) \s
        |
         \[
         SRC= (?<icmp_err_src_ip>[0-9.]{7,15}) \s
         DST= (?<icmp_err_dst_ip>[0-9.]{7,15}) \s
         .*
         PROTO=(?<icmp_err_proto>[^ ]+) \s
         (?:
          SPT=(?<icmp_err_src_port>\d+) \s
          DPT=(?<icmp_err_dst_port>\d+) \s
         )?
         [^\]]*
         \] .*
        )?
       |
        (?<proto>ESP) \s
        SPI=(?<esp_spi>0x[A-Fa-f0-9]+) \s
       |
        (?<proto>[^ ]+) \s
        (?: (?<proto_extra>[^\s].*) \s )?
       )

       # Output rules might have --log-uid applied
       (?:
        UID=(?<uid>[0-9]+) \s
        GID=(?<gid>[0-9]+) \s
       )?
       # Packet markings
       (?: MARK=(?<pkt_mark>0x[A-Fa-f0-9]+) \s )?

       # support arbitrary unknown suffixes rather than fail to match
       (?<fw_unknown_suffix>.*)
       $
    types: 'src_port:integer,dst_port:integer,pkt_ttl:integer,pkt_tos:integer,pkt_len:integer'

  - name: couchbase_json_log_nanoseconds
    # Various parsers for Couchbase Server logs
    #
    format: json
    time_key: timestamp
    time_format: '%Y-%m-%dT%H:%M:%S.%L'
    time_keep: On
    # Do not remove the time field from the output we ship
    #

  - name: couchbase_rebalance_report
    format: json
    time_key: timestamp
    time_format: '%Y-%m-%dT%H:%M:%SZ'
    time_keep: On

  - name: couchbase_simple_log
    # The level may have optional brackets around it
    format: regex
    regex: '^(?<timestamp>\d+-\d+-\d+T\d+:\d+:\d+\.\d+(\+|-)\d+:\d+)\s+\[(?<level>\w+)\](?<message>.*)$'
    time_key: timestamp
    time_format: '%Y-%m-%dT%H:%M:%S.%L%z'
    time_keep: On

  - name: couchbase_simple_log_space_separated
    format: regex
    regex: '^(?<timestamp>\d+-\d+-\d+T\d+:\d+:\d+\.\d+(\+|-)\d+:\d+)\s+(?<level>\w+)\s+(?<message>.*)$'
    time_key: timestamp
    time_format: '%Y-%m-%dT%H:%M:%S.%L%z'
    time_keep: On

  - name: couchbase_simple_log_utc
    # Slight change in time format to use Z at end instead of offset:
    # 2021-03-09T17:32:02.136Z INFO ...
    # https://rubular.com/r/EpG3M1dHb5AnTC
    format: regex
    regex: '^(?<timestamp>\d+-\d+-\d+T\d+:\d+:\d+\.\d+Z)\s+(?<level>\w+)(?<message>.*)$'
    time_key: timestamp
    time_format: '%Y-%m-%dT%H:%M:%S.%LZ'
    time_keep: On

  - name: couchbase_simple_log_mixed
    # Cope with two different log formats, e.g.:
    # 2021/03/09 17:32:15 cbauth: ...
    # 2021-03-09T17:32:15.303+00:00 [INFO] ...
    # https://rubular.com/r/XUt7xQqEJnrF2M
    format: regex
    regex: '^(?<timestamp>\d+(-|/)\d+(-|/)\d+(T|\s+)\d+:\d+:\d+(\.\d+(\+|-)\d+:\d+|))\s+((\[)?(?<level>\w+)(\]|:))(?<message>.*)$'
    time_key: timestamp
    time_keep: On
    # We cannot parse the time as different formats directly, it could be done downstream and/or left as current time
    #

  - name: couchbase_erlang_multiline
    format: regex
    # For some reason this cannot parse an ending close bracket ] followed by a new line immediately
    #regex: '\[(?<logger>\w+):(?<level>\w+),(?<timestamp>\d+-\d+-\d+T\d+:\d+:\d+.\d+Z),.*\](?<message>.*)$'
    regex: '\[(?<logger>\w+):(?<level>\w+),(?<timestamp>\d+-\d+-\d+T\d+:\d+:\d+.\d+Z),(?<message>.*)$'
    time_key: timestamp
    time_format: '%Y-%m-%dT%H:%M:%S.%L'
    time_keep: On

  - name: couchbase_java_multiline
    # 2021-03-09T17:32:25.339+00:00 INFO CBAS.bootstrap.AnalyticsNCApplication [main] ...
    # https://rubular.com/r/9jh1oKtXBN5GEV
    # Can include an exception stack trace or a thread dump as well but ignoring these for now
    format: regex
    regex: '^(?<timestamp>\d+-\d+-\d+T\d+:\d+:\d+\.\d+(\+|-)\d+:\d+)\s+(?<level>\w+)\s+(?<class>.*)\s+\[(?<thread>.*)\]\s+(?<message>.*)$'
    time_key: timestamp
    time_format: '%Y-%m-%dT%H:%M:%S.%L%z'
    time_keep: On

  - name: couchbase_http
    # A slight modification of the usual Apache/Apache2 parsers
    format: regex
    regex: '^(?<host>[^ ]*) [^ ]* (?<user>[^ ]*) \[(?<timestamp>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^ ]*) +\S*)?" (?<code>[^ ]*) (?<size>[^ ]*) - (?<client>.*)$'
    time_key: timestamp
    time_format: '%d/%b/%Y:%H:%M:%S %z'
    time_keep: On

# End of Couchbase Server parsers
